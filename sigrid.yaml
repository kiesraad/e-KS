languages:
  - name: "css"  

  - name: "typescript"
    production:
    test:
      include:
        - ".*/playwright/tests/.*"

  - name: "rust"
    production:
    test:
      include:
        - ".*_tests?[.]rs"
        - ".*/test_utils[.]rs"

exclude:
  - ".*[.]md"
  - ".*/deploy/.*"
  - ".*/development/.*"
  - ".*/docs/.*"
  - ".*/frontend/fonts/.*"
  - ".*/frontend/icons/.*"
  - ".*/locales/.*"
  - ".*/src/models/fonts/.*"
  - ".*/src/models/example-inputs/.*"
  - ".*/offline/.*"
  - ".*/src/fixtures/.*"
  - ".*/tooling/.*"
  - ".*/validate/.*"

dependencychecker:
  blocklist:
    - "eks"
    - "validate"
    - "memory-serve"
    - "textris-pdf"
  transitive: true

architecture:
  enabled: true

thirdpartyfindings:
  enabled: true
  exclude:
    - ".*[.]md"
    - ".*/deploy/.*"
    - ".*/offline/.*"
    - ".*/development/.*"
