[package]
name = "eks"
version = "0.8.0"
edition = "2024"
license = "EUPL-1.2"
rust-version = "1.95"
publish = false
readme = "README.md"
description = "Elektronisch kandidaatstellingssysteem"
documentation = "https://kiesraad.github.io/e-KS/e_ks/"
repository = "https://github.com/kiesraad/e-KS"

[features]
# Default development-oriented feature set.
default = ["database", "migrations", "fixtures", "livereload", "dev-features", "http-logging", "db-tests", "net-tests"]
# Development-only defaults (relaxes some config requirements + proxy to bag service).
dev-features = []
# Enable database-backed storage via Postgres / SQLx.
database = ["dep:sqlx"]
# Run database migrations on startup.
migrations = ["database"]
# Load fixture data on startup (dev/test).
fixtures = []
# Enable database-dependent tests.
db-tests = ["database"]
# Enable network-dependent tests.
net-tests = []
# Enable HTTP request/response tracing via tower-http.
http-logging = ["tower-http/trace"]
# Live-reload assets/templates during development.
livereload = []
# Serve embedded static assets from memory.
memory-serve = ["dep:memory-serve"]
# Run the embedded Typst webservice in-process.
embed-typst = ["dep:typst-webservice"]
# Embed the bag address lookup library
embed-bag = ["dep:bag_address_lookup"]
# Serve over HTTPS via rustls (production deployments).
tls = ["dep:axum-server"]

[dependencies]
# tokio universe
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["routing", "typed-routing", "form", "cookie", "typed-header"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"], optional = true }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
tokio = { version = "1.52.1", features = ["full", "test-util"] }
tower-http = { version = "0.6.8", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
bytes = "1.11.1"

# rust-lang
futures-core = "0.3.32"
regex = "1.12.3"

# blessed.rs / dtolnay
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7"

# blessed.rs
chrono = { version = "0.4.44", features = ["alloc", "std", "serde"] }
parking_lot = "0.12.5"
rand = "0.10.1"
sqlx = { version = "0.8.6", optional = true, features = ["runtime-tokio", "postgres", "chrono", "uuid", "tls-none"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v5", "v8"] }
url = "2.5.8"
# for now, we don't need TLS in reqwest as we only use it for cluster internal traffic with Typst
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }

# well maintained + many downloads
askama = "0.15.6" # 31M downloads (Dirkjan Ochtman)
chrono-tz = "0.10.4" # 103M downloads (Dirkjan Ochtman)
csv = "1.4.0" # 136M downloads (Andrew Gallant)
phf = { version = "0.13.1", default-features = false } # 247M downloads (Steven Fackler)
aes-gcm = "0.10.3" # 92M downloads (RustCrypto)
hkdf = "0.13.0" # 155M downloads (RustCrypto)
postcard = { version = "1.1.3", features = ["alloc"] } # 27M downloads (James Munns)
secrecy = "0.10.3" # 89M downloads (Tony Arcieri)
sha2 = "0.11.0" # 161M downloads (RustCrypto)
urlencoding = "2.1.3" # 174M downloads (Kornel)

# tweedegolf
memory-serve = { version = "2.1.0", optional = true }
validate = { path = "validate" }
auth-service = { path = "auth-service" }
typst-webservice = { git = "https://github.com/tweedegolf/typst-webservice.git", tag = "0.7.0", optional = true }
bag_address_lookup = { git = "https://github.com/tweedegolf/bag-address-lookup.git", tag = "lib-v0.5.0", default-features = false, features = ["compressed_database"], optional = true }

[build-dependencies]
memory-serve = { version = "2.1.0", optional = true }
phf_codegen = "0.13.1"

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
tracing-test = "0.2.6"

[lints.rust]
unsafe_code = "forbid"

# https://askama.readthedocs.io/en/stable/performance.html#slow-debug-recompilations
[profile.dev.package.askama_derive]
opt-level = 3
