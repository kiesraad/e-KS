[package]
name = "eks"
version = "0.10.0"
edition = "2024"
license = "EUPL-1.2"
rust-version = "1.95"
publish = false
readme = "README.md"
description = "Elektronisch kandidaatstellingssysteem"
documentation = "https://kiesraad.github.io/e-KS/e_ks/"
repository = "https://github.com/kiesraad/e-KS"

[features]
# Default development-oriented feature set.
default = ["database", "migrations", "fixtures", "livereload", "dev-features", "db-tests", "net-tests"]
# Development-only defaults (relaxes some config requirements + proxy to bag service).
dev-features = []
# Enable database-backed storage via Postgres / SQLx.
database = ["dep:sqlx"]
# Run database migrations on startup.
migrations = ["database"]
# Load fixture data on startup (dev/test).
fixtures = []
# Enable database-dependent tests.
db-tests = ["database"]
# Enable network-dependent tests.
net-tests = []
# Verify the per-event hash chain when replaying persisted events. Adds a
# SHA-256 over every event's stored bytes on load; off by default.
verify-event-hash-chain = []
# Live-reload assets/templates during development.
livereload = []
# Serve embedded static assets from memory.
memory-serve = ["dep:memory-serve"]
# Run the embedded Typst webservice in-process.
embed-typst = ["dep:typst-webservice"]
# Embed the bag address lookup library
embed-bag = ["dep:bag_address_lookup"]
# Serve over HTTPS via rustls (production deployments).
tls = ["dep:axum-server", "dep:rustls"]

[dependencies]
# tokio universe
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["routing", "typed-routing", "form", "cookie", "typed-header"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23.40", optional = true }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
tokio = { version = "1.52.1", features = ["full", "test-util"] }
tower-http = { version = "0.6.11", features = ["set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
bytes = "1.11.1"
tokio-util = { version = "0.7", features = ["io"] }

# rust-lang
futures-core = "0.3.32"
regex = "1.12.3"

# blessed.rs / dtolnay
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7"

# blessed.rs
chrono = { version = "0.4.44", features = ["alloc", "std", "serde"] }
parking_lot = "0.12.5"
rand = "0.10.1"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", optional = true, features = ["runtime-tokio", "postgres", "chrono", "uuid", "tls-none"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v5", "v8"] }
url = "2.5.8"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream"] }

# well maintained + many downloads
askama = "0.16.0" # 33M downloads (Dirkjan Ochtman)
async_zip = { version = "0.0.18", features = ["tokio", "deflate"] } # 4M downloads (Harry Majored)
chrono-tz = "0.10.4" # 107M downloads (Dirkjan Ochtman)
csv = "1.4.0" # 179M downloads (Andrew Gallant)
phf = { version = "0.13.1", default-features = false } # 340M downloads (Steven Fackler)
aes-gcm = "0.10.3" # 100M downloads (RustCrypto)
hkdf = "0.13.0" # 166M downloads (RustCrypto)
postcard = { version = "1.1.3", features = ["alloc"] } # 31M downloads (James Munns)
secrecy = "0.10.3" # 108M downloads (Tony Arcieri)
urlencoding = "2.1.3" # 184M downloads (Kornel)

# tweedegolf
memory-serve = { version = "2.1.0", optional = true }
validate = { path = "validate" }
auth-service = { path = "auth-service" }
typst-webservice = { git = "https://github.com/tweedegolf/typst-webservice.git", tag = "0.8.0", default-features = false, optional = true }
bag_address_lookup = { git = "https://github.com/tweedegolf/bag-address-lookup.git", tag = "lib-v0.8.0", default-features = false, features = ["compressed_database"], optional = true }

# kiesraad
eml-nl = { git = "https://github.com/kiesraad/rust-eml-nl.git" } # TODO: replace with crates.io version when the branch gets merged

[build-dependencies]
memory-serve = { version = "2.1.0", optional = true }
phf_codegen = "0.13.1"

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
tracing-test = "0.2.6"
# Adds rustls to reqwest for TLS server tests. Dev-only: the production
# binary still builds reqwest without any TLS backend.
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"

# https://askama.readthedocs.io/en/stable/performance.html#slow-debug-recompilations
[profile.dev.package.askama_derive]
opt-level = 3
