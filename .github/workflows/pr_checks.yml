name: PR checks

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-pr-title-check
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-title-check:
    if: github.event.pull_request.draft == false
    name: PR title check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Need to be able to edit the PR body
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Issue number(s) included in PR title
        run: bash .github/scripts/check-pr-title.sh
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}

      - name: Link issues to numbers
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fn = require('./.github/scripts/link-issues-to-pr.js')
            await fn({ github, context, core })
        env:
          TITLE: ${{ github.event.pull_request.title }}
