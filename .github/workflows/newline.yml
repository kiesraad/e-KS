name: Check newline at the end of files

permissions: {}
concurrency:
  group: 
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-newline
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  newline:
    name: Check every file has a newline at the end
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check newline
        shell: bash
        run: ./bin/check_newline
