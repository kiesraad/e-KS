name: Check newline at the end of files

permissions: {}
concurrency:
  group: 
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-newline
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  newline:
    name: Check every file has a newline at the end
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          persist-credentials: false
      - name: Check newline
        shell: bash
        run: ./bin/check_newline
