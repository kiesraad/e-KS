name: Build, lint & test

permissions: {}
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-build-lint-test
  # Never cancel main runs: they upload the test-server binary and create releases.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main

env:
  TZ: "Europe/Amsterdam"

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - &checkout-with-history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: '0'
          persist-credentials: false

      - name: Filter changes for non-Markdown files
        id: filter
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]] || [[ $(git diff --name-only "origin/${GITHUB_BASE_REF}" HEAD | grep -v "\.md$") ]]  ; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Rust format
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        shell: bash
        run: >
          rustup update nightly &&
          rustup default nightly &&
          rustup component add --toolchain nightly rustfmt

      - name: Check rustfmt
        run: cargo --locked fmt --all -- --check

  frontend:
    name: Frontend lint
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - *checkout

      - &setup-stable-rust
        name: Setup Rust
        shell: bash
        run: >
          rustup update stable &&
          rustup default stable &&
          rustup component add --toolchain stable clippy

      - &cargo-cache-restore
        name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: eks-lint
          save-if: false

      - &tools-cache
        name: Tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-cache-v1-${{ runner.os }}-${{ hashFiles('development/Cargo.toml', 'development/src/**/*.rs', 'development/*.yml') }}

      - &setup-project
        name: Setup project
        run: bin/init

      - name: Lint Typescript, CSS and playwright tests using Biome
        run: ./bin/biome ci --error-on-warnings ./frontend/scripts ./frontend/styles ./playwright/tests

      - name: Lint HTML with djlint
        run: |
          docker run --rm \
          -v ./templates:/work/templates \
          -v ./djlint.toml:/work/djlint.toml \
          djlint \
          djlint --lint --check --configuration=djlint.toml templates

  rust-lint:
    name: Rust lint & test
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: &rust-check-env
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - *checkout
      - *setup-stable-rust

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: eks-lint

      - *tools-cache
      - *setup-project

      - name: Check Clippy with all features
        run: cargo --locked clippy --all-targets --all-features -- -D warnings

      - name: Check Clippy without default features
        run: cargo --locked clippy --all-targets --no-default-features -- -D warnings

      - name: Run tests
        run: cargo --locked test -- --nocapture

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features --document-private-items

      - name: Add redirect to main crate docs
        if: ${{ github.event_name == 'push' }}
        run: echo '<meta http-equiv="refresh" content="0; url=eks/index.html">' > target/doc/index.html

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './target/doc'

  deploy-docs:
    name: Deploy Rustdocs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust-lint
    environment:
      name: Rust crate documentation
      url: ${{ steps.deployment.outputs.page_url }}eks
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to publish docs to the pages url of the repo
      id-token: write # to verify the source of the pages deployment
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  pdf-diff:
    name: PDF diff
    permissions:
      contents: read
      pull-requests: write # Need to be able to comment on the PR
    if: ${{ needs.changes.outputs.changed == 'true' &&  github.event_name == 'pull_request' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: *rust-check-env
    steps:
      # pdf_diff checks out models/ from origin/main, so it needs history.
      - *checkout-with-history
      - *setup-stable-rust
      - *cargo-cache-restore
      - *tools-cache
      - *setup-project

      - name: Install diff-pdf
        run: sudo apt-get update && sudo apt-get install -y diff-pdf-wx

      - name: Generate PDF diff summary
        run: bin/pdf_diff

      - name: Check for diff artifacts
        id: diff-artifacts
        shell: bash
        run: |
          if find tmp/diffs -type f | read -r _; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload diff artifacts
        if: ${{ steps.diff-artifacts.outputs.has_artifacts == 'true' }}
        id: artifact-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-diffs
          path: tmp/diffs/

      - name: Comment on PR with PDF diff summary and link to artifact
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ steps.diff-artifacts.outputs.has_artifacts == 'true' && steps.artifact-upload.outputs.artifact-url || '' }}
        with:
          script: |
            const commentPdfDiffSummary = require('./.github/scripts/comment-pdf-diff-summary');
            await commentPdfDiffSummary({ github, context });

  build:
    name: Build and upload binary to test server
    permissions:
      contents: read
    environment: development
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: *rust-check-env
    steps:
      - *checkout
      - *setup-stable-rust

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: eks-build

      - *tools-cache
      - *setup-project

      - name: Build
        env:
          CARGO_SET_FEATURES: "memory-serve,database,migrations,fixtures,tls,acme,tvs-mock"
        run: bin/build

      - name: Strip debug symbols
        run: strip target/release/eks

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eks
          path: target/release/eks

      - name: Upload binary to test server
        env:
          ETES_API_KEY: ${{ secrets.ETES_API_KEY }}
          SHA_PR: ${{ github.event.pull_request.head.sha || github.sha }}
          SHA_GH: ${{ github.sha }}
        run: |
          curl -s -v \
          --fail \
          -H "Authorization: Bearer $ETES_API_KEY" \
          -T ./target/release/eks \
          https://eks-test.nl/etes/api/v1/executable/${SHA_PR}/${SHA_GH}

  playwright:
    name: Playwright tests
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - *checkout

      - name: Setup Rust
        shell: bash
        run: >
          rustup update stable

      # Own key: builds eks with the dev feature set (incl. /dev/login).
      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: eks-playwright

      - *tools-cache
      - *setup-project

      - name: Run playwright tests
        run: bin/test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30

  audit-dependencies:
    name: Audit dependencies
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - *checkout

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          arguments: --workspace --all-features

  zizmor:
    name: Lint workflow files with zizmor
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - *checkout

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0

  release:
    name: Create release if version bumped
    permissions:
      contents: write # needs write permission to create a release in the repo
    needs:
      - format
      - frontend
      - rust-lint
      - build
      - playwright
      - audit-dependencies
      - zizmor
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: create-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - *checkout

      - name: Read version
        id: version
        run: |
          version=$(awk -F' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release existence
        id: release_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = process.env.CURRENT_VERSION;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('release_exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('release_exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Install cargo-sbom
        if: steps.release_check.outputs.release_exists == 'false'
        uses: psastras/sbom-rs/actions/install-cargo-sbom@9ecc460b937ac5558c4f8ebebc9e07d2bdbef67b # v0.10.0

      - name: Create SBOM
        if: steps.release_check.outputs.release_exists == 'false'
        run: |
          mkdir sbom
          cargo-sbom --output-format=cyclone_dx_json_1_6 > sbom/cyclone-dx-1-6-sbom.json
          cargo-sbom --output-format=spdx_json_2_3 > sbom/spdx-2-3-sbom.json

      - name: Download binary
        if: steps.release_check.outputs.release_exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eks
          path: bin-release

      - name: Create release
        if: steps.release_check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
          sbom/cyclone-dx-1-6-sbom.json \
          sbom/spdx-2-3-sbom.json \
          bin-release/eks \
          --title "Version $TAG" \
          --generate-notes \
          --target "$GITHUB_SHA"
