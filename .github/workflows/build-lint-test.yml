name: Build, lint & test

permissions: {}
concurrency:
  group: 
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-build-lint-test
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

env:
  TZ: "Europe/Amsterdam"

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - &checkout-with-history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: '0'
          persist-credentials: false

      - name: Filter changes for non-Markdown files
        id: filter
        run: | 
          if [[ "${GITHUB_REF_NAME}" == "main" ]] || [[ $(git diff --name-only "origin/${GITHUB_BASE_REF}" HEAD | grep -v "\.md$") ]]  ; then 
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Rust format
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - *checkout-with-history

      - name: Setup Rust
        shell: bash
        run: >
          rustup update nightly &&
          rustup default nightly &&
          rustup component add --toolchain nightly rustfmt

      - name: Check rustfmt
        run: cargo --locked fmt --all -- --check

  frontend:
    name: Frontend lint
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - *checkout-with-history

      - &setup-stable-rust
        name: Setup Rust
        shell: bash
        run: >
          rustup update stable &&
          rustup default stable &&
          rustup component add --toolchain stable clippy rust-docs

      - &cargo-cache
        name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: eks

      - &tools-cache
        name: Tools cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bin
          key: tools-cache-v1-${{ runner.os }}-${{ hashFiles('development/Cargo.toml', 'development/src/bin/*.rs', 'development/*.yml') }}

      - &setup-project
        name: Setup project
        run: bin/init

      - name: Lint Typescript using Biome
        run: ./bin/biome ci --error-on-warnings ./frontend/scripts

      - name: Lint CSS using Biome
        run: ./bin/biome ci --error-on-warnings ./frontend/styles

      - name: Lint playwright tests using Biome
        run: ./bin/biome ci --error-on-warnings ./playwright/tests

      - name: Lint HTML with djlint
        run: |
          docker run --rm \
          -v ./templates:/work/templates \
          -v ./djlint.toml:/work/djlint.toml \
          djlint \
          djlint --lint --check --configuration=djlint.toml templates

  rust-lint:
    name: Rust lint & test
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: &rust-check-env
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - *checkout-with-history
      - *setup-stable-rust
      - *cargo-cache
      - *tools-cache
      - *setup-project

      - name: Check Clippy with all features
        run: cargo --locked clippy --all-targets --all-features -- -D warnings

      - name: Check Clippy without default features
        run: cargo --locked clippy --all-targets --no-default-features -- -D warnings

      - name: Run tests
        run: cargo --locked test --features embed-typst -- --nocapture

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features

  pdf-diff:
    name: PDF diff
    permissions:
      contents: read
      pull-requests: write # Need to be able to comment on the PR
    if: ${{ needs.changes.outputs.changed == 'true' &&  github.event_name == 'pull_request' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: *rust-check-env
    steps:
      - *checkout-with-history
      - *setup-stable-rust
      - *cargo-cache
      - *tools-cache
      - *setup-project

      - name: Install diff-pdf
        if: ${{ github.event_name == 'pull_request' }}
        run: sudo apt-get update && sudo apt-get install -y diff-pdf-wx

      - name: Generate PDF diff summary
        if: ${{ github.event_name == 'pull_request' }}
        run: bin/pdf_diff

      - name: Check for diff artifacts
        if: ${{ github.event_name == 'pull_request' }}
        id: diff-artifacts
        shell: bash
        run: |
          if find tmp/diffs -type f | read -r _; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Upload diff artifacts
        if: ${{ github.event_name == 'pull_request' && steps.diff-artifacts.outputs.has_artifacts == 'true' }}
        id: artifact-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-diffs
          path: tmp/diffs/

      - name: Comment on PR with PDF diff summary and link to artifact
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ steps.diff-artifacts.outputs.has_artifacts == 'true' && steps.artifact-upload.outputs.artifact-url || '' }}
        with:
          script: |
            const commentPdfDiffSummary = require('./.github/scripts/comment-pdf-diff-summary');
            await commentPdfDiffSummary({ github, context });

  build:
    name: Build and upload binary to test server
    permissions:
      contents: read
    environment: development
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: *rust-check-env
    steps:
      - *checkout-with-history
      - *setup-stable-rust
      - *cargo-cache
      - *tools-cache
      - *setup-project

      - name: Build
        env:
          CARGO_SET_FEATURES: "memory-serve,database,migrations,fixtures,tls,embed-typst,tvs-mock"
        run: bin/build

      - name: Strip debug symbols
        run: strip target/release/eks

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eks
          path: target/release/eks

      - name: Upload binary to test server
        env:
          ETES_API_KEY: ${{ secrets.ETES_API_KEY }}
          SHA_PR: ${{ github.event.pull_request.head.sha || github.sha }}
          SHA_GH: ${{ github.sha }}
        run: |
          curl -s -v \
          --fail \
          -H "Authorization: Bearer $ETES_API_KEY" \
          -T ./target/release/eks \
          https://eks-test.nl/etes/api/v1/executable/${SHA_PR}/${SHA_GH}

  playwright:
    name: Playwright tests
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Rust
        shell: bash
        run: >
          rustup update stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: eks

      - name: Tools cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bin
          key: tools-cache-v1-${{ runner.os }}-${{ hashFiles('development/Cargo.toml', 'development/src/*.rs', 'development/*.yml') }}

      - name: Setup project
        run: bin/init

      - name: Run playwright tests
        run: bin/test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30

  audit-dependencies:
    name: Audit dependencies
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe
        with:
          arguments: --workspace --all-features

  zizmor:
    name: Lint workflow files with zizmor
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6

  release:
    name: Create release if version bumped
    permissions:
      contents: write # needs write permission to create a release in the repo
    needs:
      - format
      - frontend
      - rust-lint
      - build
      - playwright
      - audit-dependencies
      - zizmor
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: create-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(awk -F' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release existence
        id: release_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = process.env.CURRENT_VERSION;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('release_exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('release_exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Install cargo-sbom
        if: steps.release_check.outputs.release_exists == 'false'
        uses: psastras/sbom-rs/actions/install-cargo-sbom@9ecc460b937ac5558c4f8ebebc9e07d2bdbef67b # v0.10.0

      - name: Create SBOM
        if: steps.release_check.outputs.release_exists == 'false'
        run: |
          mkdir sbom
          cargo-sbom --output-format=cyclone_dx_json_1_6 > sbom/cyclone-dx-1-6-sbom.json
          cargo-sbom --output-format=spdx_json_2_3 > sbom/spdx-2-3-sbom.json

      - name: Download binary
        if: steps.release_check.outputs.release_exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eks
          path: bin-release

      - name: Create release
        if: steps.release_check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
          sbom/cyclone-dx-1-6-sbom.json \
          sbom/spdx-2-3-sbom.json \
          bin-release/eks \
          --title "Version $TAG" \
          --generate-notes \
          --target "$GITHUB_SHA"
