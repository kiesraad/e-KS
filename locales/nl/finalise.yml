collection:
  gather_h9: Verzamel van alle kandidaten de H9 instemmingsbewijzen. Zorg ook dat alle kopieën van identiteitsbewijzen meegeleverd worden en leesbaar zijn.
  pre_submission: "De 2 weken voor de dag van kandidaatstelling kunt u de documenten alvast laten controleren door het centraal stembureau, de zogeheten 'voorinlevering'. Maak hiervoor een afspraak."
  title: "Verzamelen, controleren en ondertekenen"
complete_list:
  title: Maak uw lijst compleet
correction:
  deadline: "Uiterlijk <strong>{}</strong> om <strong>17:00</strong> dient het centraal stembureau de ontbrekende stukken te ontvangen."
  description: "Als u een verzuimbrief heeft ontvangen, heeft de politieke groepering vervolgens twee dagen de tijd om de stukken te corrigeren en opnieuw in te leveren."
  until: "Verzuim kan herstelt worden tot <strong>{}</strong>"
  title: Verzuimperiode
delivery:
  appointment: "Maak hiervoor een afspraak. Het adres is:"
  description: Op de dag van kandidaatstelling dient u uw documenten in te leveren bij het centraal stembureau.
  only_on: "De dag van kandidaatstelling is op <strong>{}</strong>"
  title: Documenten inleveren
follow_up_steps:
  description: "U bent klaar met de stappen die u binnen e-KS moet zetten, maar u bent nog niet klaar met het volledige proces. Hieronder volgen nog enkele stappen die u moet zetten om alles in te leveren."
  title: Vervolgstappen
header:
  description: "U heeft uw kandidaten en kandidatenlijsten aangemaakt. Om af te ronden, zijn er nog een paar stappen te doorlopen. Deze stappen staan uiteengezet op deze pagina."
  title: Nog een paar stappen
hearing:
  date: "De zitting is op <strong>{}</strong>"
  description: "Hier bepaalt het centraal stembureau welke partijen er op het stembiljet komen te staan, en wat de volgorde van partijen is."
  open_to_public: U kunt deze zitting bijwonen.
  title: Openbare zitting
print:
  errors_warning: "Voordat u de documenten kunt printen, moet U eerst alle fouten in stap 1 oplossen."
  h1_description: "Met de H1 stelt u, als inleveraar van de kandidatenlijst, kandidaten verkiesbaar voor een verkiezing."
  h1_title: H1 Kandidatenlijst
  h3_1_description: Met de H 3-1 krijgt de inleveraar van de kandidatenlijst toestemming om de aanduiding die door uw politieke groepering is geregistreerd boven de kandidatenlijst te plaatsen. Deze toestemming kan alleen worden gegeven door iemand die hiertoe gemachtigd is door de politieke groepering.
  h3_1_title: H3-1 Machtiging plaatsen van aanduiding
  h3_2_description: "Met de H 3-2 krijgt de inleveraar van de kandidatenlijst toestemming om de samengevoegde aanduiding boven de kandidatenlijst te plaatsen. Deze toestemming moet worden gegeven door iemand die hiertoe gemachtigd is van ieder van de betrokken politieke groeperingen."
  h3_2_title: H3-2 Machtiging plaatsen van samengevoegde aanduiding
  h4_description: "Met de H4 verzamelt uw politieke groepering ondersteuningsverklaringen van kiesgerechtigde kiezers. Dit is vereist voor politieke groeperingen die niet reeds vertegenwoordigd zijn in het betreffende orgaan of deelnemen met een blanco lijst."
  h4_title: H4 Ondersteuningsverklaringen
  h9_consent: Met dit formulier stemmen kandidaten ermee in dat ze op de kandidatenlijst staan. Ook stemmen ze in met hun positie op de lijst.
  h9_identity: Bij het inleveren van deze H9 hoort ook een leesbare kopie van het identiteitsbewijs.
  h9_title: H9 Instemmingsverklaringen
  incomplete_warning: "Let op! U kunt de documenten wel uitprinten, maar ze zullen als incompleet worden beschouwd door het centraal stembureau. Los de waarschuwingen in stap 1 op om de lijst compleet te maken."
  title: Print de documenten uit
verification:
  correction_notice: "Mocht er iets ontbreken, dan krijgt u van ons per brief een bericht met de ontbrekende stukken."
  description: Het centraal stembureau onderzoekt uw ingediende documenten op volledigheid en juistheid.
  title: Onderzoek van documenten
  until: "Het onderzoek loopt tot en met <strong>{}</strong>"
