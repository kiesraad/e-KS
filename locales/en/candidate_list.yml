  import_instructions: "<p><strong>Kopregels</strong><br> Gebruik de correcte kolomnamen. Download het export-CSV-bestand en gebruik dit als sjabloon.</p> <br> <p><strong>Volgorde</strong><br> De volgorde van personen in het CSV-bestand bepaalt de volgorde op de kandidatenlijst.</p> <br> <p><strong>Verplichte velden</strong><br> Minimaal de volgende velden moeten ingevuld zijn: <ul> <li>Voorletters</li> <li>Achternaam</li> </ul> </p> <br> <p><strong>Geboortedatum</strong><br> Gebruik het formaat <code>dd-mm-jjjj</code> (bijvoorbeeld: 31-12-1990).</p> <br> <p><strong>Geslacht</strong><br> Alleen de volgende waarden worden geaccepteerd: <ul> <li><code>female</code> | <code>frou</code> | <code>vrouw</code> | <code>f</code> | <code>v</code></li> <li><code>male</code> | <code>man</code> | <code>m</code></li> </ul> </p> <br> <p><strong>Adresgegevens</strong><br> Er zijn twee typen adressen: <ul> <li>Vul het <strong>correspondentieadres</strong> in als de persoon in Nederland woont.</li> <li>Woont de persoon niet in Nederland, vul dan de gegevens van de <strong>gemachtigde</strong> in.</li> </ul> </p> <br> <p><strong>Postcode</strong><br> Gebruik het formaat <code>1234AB</code></p>"
