collection:
  gather_h9: Collect the H9 declarations of consent from all candidates. Also ensure that all copies of identity documents are included and legible.
  pre_submission: "In the 2 weeks before nomination day, you can have the documents reviewed in advance by the central electoral committee, known as a 'pre-submission'. Please make an appointment for this."
  title: "Gather, review and sign"
complete_list:
  title: Complete your list
correction:
  deadline: "The missing documents must be received by the central electoral committee by <strong>{}</strong> at <strong>17:00</strong>."
  description: "If you have received an omission letter, the political group has two days to rectify the omissions and resubmit the documents."
  title: Omission period
  until: "Omissions can be rectified until <strong>{}</strong>"
delivery:
  appointment: "Please make an appointment for this. The address is:"
  description: On nomination day you must submit your documents to the central electoral committee.
  only_on: "Nomination day is on <strong>{}</strong>"
  title: Submit documents
follow_up_steps:
  description: "After downloading the documents, there are a few more steps to take outside of e-KS. Below, the rest of the nomination process up to and including the public session is described."
  title: Follow-up steps
header:
  description: "You have created your candidates and lists of candidates. To finalise, there are a few more steps to complete. These steps are outlined on this page."
  title: A few more steps
hearing:
  date: "The session is on <strong>{}</strong>"
  description: "During this session, the central electoral committee determines which parties will appear on the ballot, and what the order of parties will be."
  open_to_public: You may attend the session.
  title: Public session
print:
  errors_warning: "Before you can print the documents, you must first resolve all errors in step 1."
  h1_description: "With the H1, as the submitter of the list of candidates, you nominate candidates for an election."
  h1_title: H1 List of candidates
  h3_1_description: "With the H3-1, the submitter of the list of candidates receives permission to place the appellation registered by your political group above the list of candidates. This permission can only be granted by a person authorised to do so by the political group."
  h3_1_title: H3-1 Authorisation to use appellation
  h3_2_description: "With the H3-2, the submitter of the list of candidates receives permission to place the combined appellation above the list of candidates. This permission must be granted by a person authorised to do so by each of the political groups involved."
  h3_2_title: H3-2 Authorisation to use combined appellation
  h4_description: "With the H4, your political group collects declarations of support from eligible voters. This is required for political groups that are not currently represented in the relevant body or are participating with a blank list."
  h4_title: H4 Declarations of support
  h9_consent: "With this form, candidates agree to being placed on the list of candidates. They also agree to their position on the list."
  h9_identity: "When submitting this H9, a legible copy of the identity document must also be included."
  h9_title: H9 Declarations of consent
  incomplete_warning: "Attention! You can print the documents, but they will be considered incomplete by the central electoral committee. Resolve the warnings in step 1 to complete the list."
  title: Print the documents
verification:
  correction_notice: "If anything is missing, you will receive a letter from us listing the missing documents."
  description: The central electoral committee reviews the submitted documents for completeness and correctness.
  title: Review of documents
  until: "The review runs until <strong>{}</strong>"
