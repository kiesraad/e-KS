button:
  digid: Log in
cancelled:
  message: You cancelled the login. You are not logged in to Candidate Nomination of the Kiesraad. Log in again to continue.
  title: Login cancelled
error:
  # TVS "Checklist Testen" v2.1 L10: this is the translated DICTU-mandated DigiD error text
  message: Logging in to this organisation did not succeed. Please try again later. Still not working? Log in to Mijn DigiD to check that your DigiD works correctly. There may be a malfunction at the organisation you are logging in to.
  title: Login failed
signed_out:
  message: "You have been logged out of Candidate Nomination of the Kiesraad. Close your browser to end the session completely, or log in again."
  title: You have been logged out
start:
  intro: You log in first. After that you have access to the Candidate Nomination application of the Kiesraad. Click the button below to log in; you will be guided through the login process step by step.
  title: Log in to Candidate Nomination
unavailable:
  message: The login service is currently unavailable. Please try again in a few minutes.
  title: Login temporarily unavailable
