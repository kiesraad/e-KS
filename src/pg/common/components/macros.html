{% macro csrf_field() %}
  <input type="hidden" name="csrf_token" value="{{ "csrf_token"|str_value }}">
{% endmacro csrf_field %}
{% macro download_button(label, href, downloadable, version) %}
  {% if downloadable %}
    <a href="{{ href }}" class="button secondary icon-download">{{ label }} (v{{ version }})</a>
  {% else %}
    <a class="button secondary icon-download disabled" aria-disabled="true">{{ label }} (v{{ version }})</a>
  {% endif %}
{% endmacro download_button %}
