<div class="country-input input-icon">
  <span class="icon">🌐</span>
  <input type="text"
         name="country"
         id="country"
         value="{{ country_value }}"
         minlength="2"
         maxlength="2"
         required
         class="uppercase" />
  <ul>
    {% for country in crate::structs::common::COUNTRY_CODES %}
      <li data-country="{{ country }}">
        <span class="icon">{{ country|flag }}</span> {{ country }}
      </li>
    {% endfor %}
  </ul>
</div>
<span class="hint">{{ "person.hints.country_code"|trans(crate::structs::common::RVIG_COUNTRY_CODES_URL) |safe }}</span>
