{% extends "pg/common/components/layout.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
  <div class="card error-card">
    <div class="alert alert-error">{{ message }}</div>
    <div class="error-card-footer">
      <a href="/" class="button">{{ "action.back_home"|trans }}</a>
      <span class="error-code">{{ "common.error_code"|trans(status_code.as_str() ) }}</span>
    </div>
  </div>
{% endblock %}
