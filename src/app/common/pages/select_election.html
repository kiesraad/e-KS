{% extends "common/components/base.html" %}
{% block body %}
  <header>
    <div class="header-content">
      <h1>{{ "common.title"|trans }}</h1>
    </div>
  </header>
  <main>
    <h2>{{ "common.select_election.label"|trans }}</h2>
    <p>{{ "common.select_election.description"|trans }}</p>
    <form method="post"
          action="{{ crate::common::SelectElectionPath.to_string() }}"
          class="form election-switch mt-xl">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <fieldset>
        <p class="form-field form-field-lg">
          <label for="election">{{ "common.switch_election.election"|trans }}</label>
          <select name="election" id="election">
            {% for e in elections %}
              <option value="{{ e.code() }}"
                      data-region-kind="{% match e.election_type() %}{% when crate::ElectionType::Ps %}province{% when crate::ElectionType::Ws %}water_council{% else %}{% endmatch %}">
                {{ e.title(*title_locale) }}
              </option>
            {% endfor %}
          </select>
        </p>
        <p class="form-field form-field-lg region-select mt-md"
           data-region-kind="province">
          <label for="region_province">{{ "common.switch_election.province"|trans }}</label>
          <select name="region_province" id="region_province">
            <option value="">-- {{ "common.switch_election.select_region"|trans }} --</option>
            {% for p in provinces %}<option value="{{ p.code() }}">{{ p.title(*title_locale) }}</option>{% endfor %}
          </select>
        </p>
        <p class="form-field form-field-lg region-select mt-md"
           data-region-kind="water_council">
          <label for="region_water_council">{{ "common.switch_election.water_council"|trans }}</label>
          <select name="region_water_council" id="region_water_council">
            <option value="">-- {{ "common.switch_election.select_region"|trans }} --</option>
            {% for wc in water_councils %}<option value="{{ wc.code() }}">{{ wc.title(*title_locale) }}</option>{% endfor %}
          </select>
        </p>
        {% if fixtures %}
          <p class="form-field mt-md">
            <label>
              <input type="checkbox" name="load_fixtures" value="true">
              {{ "common.select_election.load_fixtures"|trans }}
            </label>
          </p>
        {% endif %}
      </fieldset>
      <div class="form-actions">
        <button type="submit" class="button">{{ "common.select_election.submit"|trans }}</button>
      </div>
    </form>
  </main>
{% endblock %}
