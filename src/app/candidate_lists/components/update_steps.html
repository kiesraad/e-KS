<div class="steps-nav">
  <ul>
    {% let election = "election"|election_value %}
    {% if !election.has_only_one_district() %}
      <li>
        <a href="{{ candidate_list.update_path() }}"
           class="{% if should_warn|default(true) %}{% if candidate_list.electoral_districts.is_empty() %}warning{% else %}ok{% endif %}{% endif %}">
          {{ "candidate_list.fields.electoral_districts"|trans }}
        </a>
      </li>
    {% endif %}
    <li>
      <a href="{{ candidate_list.update_list_submitter_path() }}"
         class="{% if should_warn|default(true) %}{% if candidate_list.list_submitter_id.is_some() %}ok{% else %}warning{% endif %}{% endif %}">
        {{ "candidate_list.fields.list_submitter"|trans }}
      </a>
    </li>
  </ul>
</div>
